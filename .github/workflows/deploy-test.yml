name: Deploy All Projects to TEST

on:
  workflow_dispatch:

env:
  FRONTEND_TOKEN: ${{ secrets.SWA_TOKEN_FRONTEND_TEST }}
  MERCHANT_TOKEN: ${{ secrets.SWA_TOKEN_MERCHANT_TEST }}
  API_RESOURCE_GROUP: paybysharepay-rg
  API_APP_NAME: paybysharepay-api

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: src/Frontend.PayBySharePay
        run: npm ci


      - name: Build Angular (test)
        working-directory: src/Frontend.PayBySharePay
        run: npx ng build --configuration test

      - name: List dist folder contents
        working-directory: src/Frontend.PayBySharePay
        run: ls -l ./dist

      - name: Deploy Angular to Azure Static Web Apps (TEST)
        working-directory: src/Frontend.PayBySharePay
        run: npx @azure/static-web-apps-cli deploy ./dist/frontend.paybysharepay --deployment-token $FRONTEND_TOKEN --env default

      - name: Deploy MerchantDemo to Azure Static Web Apps (TEST)
        run: npx @azure/static-web-apps-cli deploy ./src/Frontend.MerchantDemo --deployment-token $MERCHANT_TOKEN --env default

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Publish .NET API
        run: dotnet publish src/Api.PayBySharePay/Api.PayBySharePay.csproj --configuration Release --output ./publish-output

      - name: Zip publish output
        run: zip -r publish-output.zip ./* 
        working-directory: ./publish-output

      - name: Azure CLI login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Azure App Service (TEST)
        run: az webapp deploy --resource-group $API_RESOURCE_GROUP --name $API_APP_NAME --src-path ./publish-output/publish-output.zip --type zip

      - name: Install go-sqlcmd
        run: |
          SQLCMD_VERSION="1.8.2"
          curl -sSL "https://github.com/microsoft/go-sqlcmd/releases/download/v${SQLCMD_VERSION}/sqlcmd-linux-amd64.tar.bz2" -o sqlcmd.tar.bz2
          tar -xjf sqlcmd.tar.bz2 sqlcmd
          sudo mv sqlcmd /usr/local/bin/sqlcmd-go
          sqlcmd-go --version

      - name: Run database migrations (Azure AD token)
        run: |
          TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          sqlcmd-go -S paybysharepay-server.database.windows.net -d PayBySharePay-Test --access-token "$TOKEN" -i migrate-test.sql
