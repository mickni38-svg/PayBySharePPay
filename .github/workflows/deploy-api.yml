name: Deploy API til TEST

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy .NET API til TEST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Publish API
        run: |
          dotnet publish src/Api.PayBySharePay/Api.PayBySharePay.csproj \
            --configuration Release \
            --output ./publish-output

      - name: Zip output
        run: zip -r publish-output.zip ./publish-output

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy til TEST
        run: |
          az webapp deploy \
            --resource-group paybysharepay-rg \
            --name paybysharepay-api \
            --src-path publish-output.zip \
            --type zip
          echo "API deployed til: https://paybysharepay-api.azurewebsites.net"
