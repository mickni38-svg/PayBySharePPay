<div class="login">
  <div class="login__card">

    <header class="login__header">
      <div class="login__logo">💳</div>
      <h1 class="login__title">PayBySharePay</h1>
      <p class="login__sub">Log ind for at fortsætte</p>
    </header>

    <form class="login__form" (ngSubmit)="submit()">
      <input
        class="login__input"
        type="email"
        placeholder="din@email.dk"
        [(ngModel)]="email"
        name="email"
        autocomplete="email"
        required
      />

      <div class="login__password-wrap">
        <input
          class="login__input"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Adgangskode"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="login__eye"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Skjul adgangskode' : 'Vis adgangskode'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>

      @if (error()) {
        <p class="login__error">{{ error() }}</p>
      }

      <button
        class="login__btn"
        type="submit"
        [disabled]="loading() || !email"
      >
        @if (loading()) { Logger ind… } @else { Log ind }
      </button>

      <p class="login__register-link">
        Ingen konto? <a routerLink="/register">Opret konto</a>
      </p>
    </form>

  </div>
</div>
